[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprorestore"
version = "0.1.0"
description = "Deterministic capture and verification baseline for reproducible recovery of stateful services"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "ONMAKE S.r.l."}]

[project.urls]
Homepage = "https://github.com/MaxTulli70/reprorestore"
Repository = "https://github.com/MaxTulli70/reprorestore"
Issues = "https://github.com/MaxTulli70/reprorestore/issues"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
reprorestore = "reprorestore.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
